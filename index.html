<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Родословная Павла Железняка</title>
<style>
/* VOICE: спокойный, архивный, бережный — семейная история, а не приложение
   IDEA: большой лист родословной на столе архива; лупа и карточка-выписка сбоку
   PICTURE: само древо на весь экран, его можно двигать и увеличивать
   COLOUR and TYPE: белый лист, тёмные чернила, золото прямой линии; Alegreya Sans
   LAYOUT: верхняя полоса с поиском, лист на весь экран, карточка человека справа (снизу на телефоне) */
:root{color-scheme:light dark;--bg:light-dark(#eceae4,#1d1c1a);--paper:#ffffff;--ink:light-dark(#1d1b18,#ece8e1);--mute:light-dark(#6b665e,#a9a297);
--line:light-dark(#d8d4cb,#3a3733);--panel:light-dark(#fbfaf7,#262421);--gold:#d9a400;--chip:light-dark(#efece5,#33302c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px max(2vw,12px);border-bottom:1px solid var(--line);background:var(--panel);z-index:3}
h1{font-size:22px;line-height:1.05;margin:0;font-weight:800;margin-right:auto}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute)}
.search{position:relative;flex:1 1 220px;max-width:360px}
.search input{width:100%;height:44px;font:inherit;font-size:16px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.search input:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
#results{position:absolute;top:48px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;max-height:50vh;overflow:auto;display:none;box-shadow:0 10px 30px #0003}
#results button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;font:inherit;color:var(--ink);min-height:44px;cursor:pointer}
#results button:hover{background:var(--chip)}#results small{color:var(--mute)}
.tools{display:flex;gap:6px}
.tools button{height:44px;min-width:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-weight:500;cursor:pointer}
.tools button.main{background:var(--gold);border-color:var(--gold);color:#1d1b18;font-weight:700}
main{flex:1;position:relative;display:flex;min-height:0}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;background:var(--paper);user-select:none;-webkit-user-select:none}
#stage svg text{pointer-events:none}
#stage.drag{cursor:grabbing}
#stage>svg{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#hint{position:absolute;left:12px;bottom:12px;background:#1d1b18cc;color:#fff;font-size:13px;padding:6px 10px;border-radius:8px;pointer-events:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:#6b665e}
.person{cursor:pointer}
svg.sel .person:not(.on){opacity:.16}svg.sel .fam:not(.on){opacity:.08}svg.sel .gold{opacity:.25}
svg.sel .person.me>rect:nth-of-type(2){stroke:#e63b00}
aside{width:min(400px,40vw);border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:18px 20px 40px;display:none}
aside.open{display:block}
aside h2{font-size:26px;line-height:1.08;margin:0 0 4px;text-wrap:balance}
.meta{color:var(--mute);font-size:15px;margin:0 0 12px}
.kin{display:inline-block;background:var(--gold);color:#1d1b18;font-weight:700;border-radius:6px;padding:0 8px;margin-right:6px}
aside h3{font-size:15px;margin:18px 0 6px;color:var(--mute);font-weight:700}
.ev{border-top:1px solid var(--line);padding:8px 0;font-size:15px}
.ev b{white-space:nowrap}.ev .s{color:var(--mute);font-size:13px}
.notes p{margin:0 0 10px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:15px;min-height:40px;cursor:pointer}
.chipx{border:0;background:none;color:#0d6e8a;font:inherit;font-size:15px;padding:0;text-decoration:underline;cursor:pointer}
.close{float:right;height:40px;width:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:20px;cursor:pointer}
a{color:#0d6e8a;overflow-wrap:anywhere}
.photos img{width:100%;border-radius:12px;display:block;margin:6px 0 4px}
.docs{display:grid;gap:8px}
.doc{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:6px;font:inherit;font-size:14px;cursor:pointer;min-height:64px}
.doc img{width:96px;height:56px;object-fit:cover;border-radius:6px;background:#fff}
.doc small{display:block;color:var(--mute)}
.god{font-size:15px;margin:0 0 6px}
#lb{position:fixed;inset:0;background:#000c;display:none;z-index:10;overflow:auto;padding:16px}
#lb.open{display:block}
#lb .box{max-width:1100px;margin:0 auto;background:var(--panel);color:var(--ink);border-radius:14px;padding:16px 18px 22px}
#lb img{width:100%;border-radius:8px;background:#fff;display:block;margin:10px 0}
#lb h2{font-size:22px;margin:0 40px 4px 0;line-height:1.15}
#lb p{margin:6px 0;font-size:16px}
#lb ul{margin:4px 0 8px;padding-left:20px}#lb li{margin:4px 0;font-size:16px}#lb h3{font-size:17px;margin:16px 0 4px;color:var(--ink)}

@media(max-width:760px){main{flex-direction:column}aside{width:auto;border-left:0;border-top:1px solid var(--line);max-height:48vh}h1{font-size:19px}h1 small{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<h2>Как читать схему</h2>
<h3>Карточки</h3>
<ul>
<li><b>Голубая</b> карточка — мужчина, <b>оранжевая</b> — женщина.</li>
<li><b>Цветная полоска сверху</b> — род человека (Новиковы, Белозеровы, Кутрюмовы, Левкины, Бобровы, Бычины, Логиновы, Железняки). Род считается по отцу; жена с неизвестными родителями — в роду мужа. Цвета — в легенде под заголовком схемы.</li>
<li>В карточке: фамилия (у замужних женщин девичья — в скобках), имя, отчество, даты жизни.</li>
<li><b>Толстая рамка</b> — человек найден в архивных документах (метриках, ревизских сказках).</li>
<li><b>Пунктирная рамка карточки</b> — известен только по семейному преданию.</li>
<li><b>Золотая обводка</b> — прямая линия Павла. Внизу подписано родство: «Прадед», «Пра(3)бабушка» и т. д.</li>
</ul>
<h3>Даты</h3>
<ul>
<li>«07.03.1877 – 11.05.1949» — точные даты рождения и смерти; «– ?» — дата смерти неизвестна.</li>
<li>«ок. 1848» — год вычислен по возрасту в документе.</li>
<li>«~1850» — год примерно оценён по родственникам, документов нет.</li>
<li>Даты XIX века — по старому стилю, как в метрических книгах.</li>
</ul>
<h3>Семьи и рамки</h3>
<ul>
<li>Каждое поколение — в своём ряду: старшие сверху, младшие снизу.</li>
<li><b>Серая рамка</b> «дети: Николай и Ефросинья» — братья и сёстры, дети одной пары. Стоят не всегда по возрасту, а так, чтобы быть над своими детьми.</li>
<li><b>Белая пунктирная подложка</b> «жена», «муж», «1-я жена» — супруг из другой семьи (его родители неизвестны), рядом со своим мужем или женой.</li>
<li>«Братья (родители неизвестны)» — Павел и Филипп Бычины.</li>
</ul>
<h3>Линии</h3>
<ul>
<li>Супруги соединены горизонтальной линией, точка на ней — брак. От неё линия идёт вниз к общей горизонтали и к каждому ребёнку.</li>
<li>У каждой семьи свой цвет линий, соседние линии — разных цветов: семью можно проследить по цвету.</li>
<li>Справа вверху — семья Савелия Григорьевича Новикова: соседи из той же деревни, родство не доказано.</li>
</ul>
<h3>Как пользоваться</h3>
<ul>
<li>Двигать — мышкой или пальцем; масштаб — колёсиком, двумя пальцами или кнопками «+» и «−».</li>
<li>Нажмите на человека — подсветятся его предки, потомки и супруги, а сбоку откроется карточка: даты, события с источниками, заметки, фото, крёстные, родители, братья и сёстры, супруги, дети.</li>
<li>«В архивных документах» — сканы, где человек упомянут; по нажатию скан открывается крупно, с расшифровкой и ссылкой на дело в Пермском архиве.</li>
<li>Поиск — по имени, фамилии или девичьей фамилии.</li>
<li>«Моя линия» — прямая линия Павла, «Всё» — всё древо.</li>
</ul>
</template>

9", "text": "д. Сикаши (Чикаши), семья № 225: Гаврило (Гавриил) Григорьев Новиков с сыновьями; «Гаврилы сын Иван» (29 лет), «Иванов сын Долмат» (4 года).", "note": "Подтверждает связь Гавриил → Иван → Долмат.", "who": ["I33", "I26", "I18", "I10", "I32"]}, "d02": {"id": "d02", "file": "02_ревизия1850_Новиковы_жен", "img": "scans/d02.jpg", "title": "Ревизская сказка 1850 г. — Новиковы, женская половина", "fond": "ГАПК, ф. 111, оп. 1", "unit": 75729, "frame": "385", "url": "https://archives.permkrai.ru/archive1/unit/75729", "text": "Та же семья № 225: жена Ивана Гавриловича — Евдокия Тимофеева, 30 лет.", "note": "", "who": ["I29", "I30", "I31", "I19"]}, "d03": {"id": "d03", "file": "03_ревизия1850_Белозеровы_муж", "img": "scans/d03.jpg", "title": "Ревизская сказка 1850 г. — Белозеровы, мужская половина", "fond": "ГАПК, ф. 111, оп. 1", "unit": 75729, "frame": "386, 388", "url": "https://archives.permkrai.ru/archive1/unit/75729", "text": "Семья № 228: Афанасий Петров Белозеров (45), его сыновья; брат Филимон/Филипп (36) и его сын Галактион (9 лет).", "note": "Галактион — отец Андрея Галактионовича (подтверждено экспертом). Имя его отца я читал «Филимон», эксперт и владелец древа — «Филипп»; принято «Филипп».", "who": ["I52", "BZ2", "BZ3", "BZ4", "BZ5", "BZ6", "BZ7", "I50", "I49"]}, "d04": {"id": "d04", "file": "04_ревизия1850_Белозеровы_жен", "img": "scans/d04.jpg", "title": "Ревизская сказка 1850 г. — Белозеровы, женская половина", "fond": "ГАПК, ф. 111, оп. 1", "unit": 75729, "frame": "387, 389", "url": "https://archives.permkrai.ru/archive1/unit/75729", "text": "Жёны семьи № 228: Марья Петрова (50), Анна Иванова, Аксинья Иванова; жена Филимона — Евдокия Николаева (36), дочери …, Мавра (4).", "note": "", "who": ["BZ1", "I53", "BZ13"]}, "d05": {"id": "d05", "file": "05_ревизия1850_Семён_Антонов", "img": "scans/d05.jpg", "title": "Ревизская сказка 1850 г. — Семён Антонов", "fond": "ГАПК, ф. 111, оп. 1", "unit": 75729, "frame": "392", "url": "https://archives.permkrai.ru/archive1/unit/75729", "text": "Семья № 235: «Семён Антонов К?тюмов», 56 лет; фамилия читается неуверенно (Кутюмов / Кутрюмов).", "note": "Вероятно, Семён Антипович Кутрюмов, отец Ксении Семёновны; в сказке — «Антонов», в метриках — «Антипов».", "who": ["I16"]}, "d06": {"id": "d06", "file": "06_ревизия1858_Новиковы", "img": "scans/d06.jpg", "title": "Ревизская сказка 1858 г. — Новиковы", "fond": "ГАПК, ф. 111, оп. 1", "unit": 75751, "frame": "126", "url": "https://archives.permkrai.ru/archive1/unit/75751", "text": "Семья Новиковых д. Сикаши по X ревизии.", "note": "", "who": ["SV2", "SV3", "I26", "I18", "I10", "I32", "I29", "I31", "I19", "I21"]}, "d07": {"id": "d07", "file": "07_ревизия1858_Белозеровы", "img": "scans/d07.jpg", "title": "Ревизская сказка 1858 г. — Белозеровы", "fond": "ГАПК, ф. 111, оп. 1", "unit": 75751, "frame": "127", "url": "https://archives.permkrai.ru/archive1/unit/75751", "text": "Семья № 218 (по IX ревизии № 228): Филимон, 43 года; жена Евдокия Николаева, 47; дочери Мавра (11) и Агафья (младенец); сын Галактион, 16 лет, не женат.", "note": "", "who": ["I52", "BZ2", "BZ3", "BZ4", "BZ5", "BZ6", "BZ7", "I50", "I49", "BZ1", "BZ8", "BZ9", "BZ10", "BZ11", "BZ12", "I53", "BZ13", "BZ14"]}, "d08": {"id": "d08", "file": "15_метрика1862_Наталья_Новикова", "img": "scans/d08.jpg", "title": "Метрика 1862 г. — рождение Натальи Ивановны Новиковой", "fond": "ГАПК, ф. 719, оп. 8 (метрические книги Богородицкой церкви Бикбардинского завода)", "unit": 967786, "frame": "114", "url": "https://archives.permkrai.ru/archive1/unit/967786", "text": "Родилась 23 августа, крещена 26 августа 1862 г. Родители: Иван Гаврилов Новиков и Евдокия Тимофеева.", "note": "", "who": ["I24", "I18", "I19"]}, "d09": {"id": "d09", "file": "15b_метрика1862_Наталья_крёстная", "img": "scans/d09.jpg", "title": "Метрика 1862 г. — Наталья Новикова, запись целиком с крёстной", "fond": "ГАПК, ф. 719, оп. 8 (метрические книги Богородицкой церкви Бикбардинского завода)", "unit": 967786, "frame": "114", "url": "https://archives.permkrai.ru/archive1/unit/967786", "text": "№ 61: «Деревни Чикаш казенный крестьянин Иван Гаврилов Новиков и жена его Евдокия Тимофеева, оба православного исповедания». Восприемница: «Мать(?) Ивана Февронія» — видимо, Февронья Авдеевна, мачеха Ивана.", "note": "Верхняя строка «Пономарь Митрофан Бердников» — подпись к предыдущей записи. Первое слово у крёстной читается неуверенно.", "who": ["I24", "I18", "I19", "I29"]}, "d10": {"id": "d10", "file": "16_метрика1865_Пелагея_Новикова", "img": "scans/d10.jpg", "title": "Метрика 1865 г. — рождение Пелагеи Новиковой", "fond": "ГАПК, ф. 719, оп. 8 (метрические книги Богородицкой церкви Бикбардинского завода)", "unit": 967786, "frame": "224", "url": "https://archives.permkrai.ru/archive1/unit/967786", "text": "Родилась 1 октября, крещена 3 октября 1865 г. Восприемница: «Семена Ант(ипова) Кутрюмова дочь девица Александра».", "note": "Крёстная — сестра Ксении Семёновны, жены Долмата.", "who": ["I25", "I18", "I19", "K1", "I16"]}, "d11": {"id": "d11", "file": "17a_метрика1867_Анна_Новикова", "img": "scans/d11.jpg", "title": "Метрика 1867 г. — рождение Анны Новиковой", "fond": "ГАПК, ф. 719, оп. 8 (метрические книги Богородицкой церкви Бикбардинского завода)", "unit": 967786, "frame": "270", "url": "https://archives.permkrai.ru/archive1/unit/967786", "text": "Родилась 5 сентября, крещена 6 сентября 1867 г. Родители: Долмат Иванов Новиков и Ксения Семенова.", "note": "", "who": ["I12", "I10", "I11"]}, "d12": {"id": "d12", "file": "17b_метрика1867_Анна_крёстная", "img": "scans/d12.jpg", "title": "Метрика 1867 г. — Анна Новикова, запись с крёстной", "fond": "ГАПК, ф. 719, оп. 8 (метрические книги Богородицкой церкви Бикбардинского завода)", "unit": 967786, "frame": "270", "url": "https://archives.permkrai.ru/archive1/unit/967786", "text": "№ 69. Восприемница: «Той же деревни крестьянина …на Антипова …рюмова дочь…» — дочь Семёна Антипова Кутрюмова; имя уходит в переплёт и на скане не видно.", "note": "П  крещён 8 марта 1877 г. Родители: Долмат Иванов Новиков и Ксения Семенова. Восприемник: Василий Трофимов Овчинников.", "note": "", "who": ["I5", "I10", "I11"]}, "d17": {"id": "d17", "file": "08_метрика1888_Прокопий_Белозеров", "img": "scans/d17.jpg", "title": "Метрика 1888 г. — рождение Прокопия Андреевича Белозерова", "fond": "ГАПК, ф. 719, оп. 8 (метрические книги Богородицкой церкви Бикбардинского завода)", "unit": 1880696, "frame": "24", "url": "https://archives.permkrai.ru/archive1/unit/1880696", "text": "Родился 3 июля 1888 г. Родители: Андрей Галактионов Белозеров и Анна Федотова.", "note": "Брат Ефросиньи.", "who": ["I54", "I46", "I47"]}, "d18": {"id": "d18", "file": "09_метрика1891_Ефросинья_Белозерова", "img": "scans/d18.jpg", "title": "Метрика 1891 г. — рождение Ефросиньи Андреевны Белозеровой", "fond": "ГАПК, ф. 719, оп. 8 (метрические книги Богородицкой церкви Бикбардинского завода)", "unit": 1880696, "frame": "148", "url": "https://archives.permkrai.ru/archive1/unit/1880696", "text": "Запись № 96: родилась 14 сентября 1891 г. Родители: Андрей Галактионов Белозеров и Анна Федотова. Восприемница — Афанасия Михайлова Боброва.", "note": "На памятнике — 1889 г.; метрика даёт 1891.", "who": ["I7", "I46", "I47"]}, "d19": {"id": "d19", "file": "21_метрика1901_Иоанн_Новиков_рожд", "img": "scans/d19.jpg", "title": "Метрика 1901 г. — рождение Иоанна Николаевича Новикова", "fond": "ГАПК, ф. 719, оп. 8 (метрические книги Богородицкой церкви Бикбардинского завода)", "unit": 967860, "frame": "98", "url": "https://archives.permkrai.ru/archive1/unit/967860", "text": "Родился 23 сентября, крещён 24 сентября 1901 г. Родители: Николай Долматов Новиков и Ксения Матвеева.", "note": "", "who": ["I9", "I5", "I6"]}, "d20": {"id": "d20", "file": "10_метрика1911_Таисия_Новикова", "img": "scans/d20.jpg", "title": "Метрика 1911 г. — рождение Таисии Николаевны Новиковой", "fond": "ГАПК, ф. 719, оп. 8 (метрические книги Богородицкой церкви Бикбардинского завода)", "unit": 1880759, " <script>
window.onerror=function(m){var l=document.getElementById('loading');if(l)l.textContent='Ошибка: '+m;};
</script>
<script>
{
const stage = document.getElementById('stage'), panel = document.getElementById('panel');
let svg = null, D = null, W = 1, H = 1;
const st = {s: 1, x: 0, y: 0};
const apply = () => { if (svg) svg.style.transform = `translate(${st.x}px,${st.y}px) scale(${st.s})`; };
const clampS = s => Math.max(0.03, Math.min(4, s));
function zoomAt(f, cx, cy) {
  const ns = clampS(st.s * f); const k = ns / st.s;
  st.x = cx - (cx - st.x) * k; st.y = cy - (cy - st.y) * k; st.s = ns; apply();
}
function fitBox(x, y, w, h, pad = 40) {
  const r = stage.getBoundingClientRect();
  const s = clampS(Math.min((r.width - 2 * pad) / w, (r.height - 2 * pad) / h, 1.6));
  st.s = s; st.x = (r.width - w * s) / 2 - x * s; st.y = (r.height - h * s) / 2 - y * s; apply();
}
const fitAll = () => fitBox(0, 0, W, H, 10);
const norm = t => (t || '').toLowerCase().replace(/ё/g, 'е');
const esc = t => String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const linkify = t => esc(t).replace(/https?:\/\/[^\s)»,;]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const pName = id => D.people[id] ? D.people[id].name : id;
const pDates = id => { const l = D.people[id].lines; return l.find(t => /\d{4}|^~/.test(t)) || ''; };

/* --- перетаскивание и масштаб --- */
const ptrs = new Map(); let moved = 0, last = null, pinch = null;
stage.addEventListener('pointerdown', e => {
  e.preventDefault(); var _s=window.getSelection&&window.getSelection(); if(_s) _s.removeAllRanges();
  stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY}); moved = 0;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = {d: Math.hypot(a.x - b.x, a.y - b.y)}; }
  last = {x: e.clientX, y: e.clientY}; stage.classList.add('drag');
});
stage.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  const r = stage.getBoundingClientRect();
  if (ptrs.size === 2 && pinch) {
    const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt(d / pinch.d, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); pinch.d = d; moved += 10; return;
  }
  const dx = e.clientX - last.x, dy = e.clientY - last.y; moved += Math.abs(dx) + Math.abs(dy);
  st.x += dx; st.y += dy; last = {x: e.clientX, y: e.clientY}; apply();
});
const up = e => {
  ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; stage.classList.remove('drag');
  if (e.type === 'pointerup' && moved < 6 && ptrs.size === 0) {
    if (stage.releasePointerCapture) try { stage.releasePointerCapture(e.pointerId); } catch(_){}
    const hit = document.elementFromPoint(e.clientX, e.clientY); const el = hit && hit.closest ? hit.closest('.person') : null;
    if (el) select(el.dataset.p, false); else clearSel();
  }
  if (ptrs.size === 1) last = [...ptrs.values()][0];
};
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
stage.addEventListener('wheel', e => { e.preventDefault(); const r = stage.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top); }, {passive: false});
const center = () => { const r = stage.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
document.getElementById('zin').onclick = () => zoomAt(1.4, ...center());
document.getElementById('zout').onclick = () => zoomAt(1 / 1.4, ...center());
document.getElementById('fit').onclick = () => { clearSel(); fitAll(); };
document.getElementById('mine').onclick = () => select('I1', true, true);
addEventListener('keydown', e => { if (e.key === 'Escape') { if (lb.classList.contains('open')) lb.classList.remove('open'); else clearSel(); } });

/* --- выделение родни --- */
function relatives(id) {
  const anc = new Set(), desc = new Set();
  const goUp = p => ((D.people[p]||{}).par || []).forEach(q => { if (!anc.has(q)) { anc.add(q); goUp(q); } });
  const goDn = p => ((D.people[p]||{}).kids || []).forEach(k => { if (!desc.has(k)) { desc.add(k); goDn(k); } });
  goUp(id); goDn(id);
  const on = new Set([id, ...anc, ...desc, ...(D.people[id].sp || [])]);
  return {on, anc, desc};
}
function bboxOf(ids) {
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  ids.forEach(id => { const g = svg.querySelector(`.person[data-p="${id}"]`); if (!g) return; const b = g.getBBox();
    x1 = Math.min(x1, b.x); y1 = Math.min(y1, b.y); x2 = Math.max(x2, b.x + b.width); y2 = Math.max(y2, b.y + b.height); });
  return [x1, y1, x2 - x1, y2 - y1];
}
function select(id, move = true, wide = false) {
  if (!D.people[id]) return;
  const {on} = relatives(id);
  svg.classList.add('sel');
  svg.querySelectorAll('.person').forEach(g => { g.classList.toggle('on', on.has(g.dataset.p)); g.classList.toggle('me', g.dataset.p === id); });
  svg.querySelectorAll('.fam').forEach(g => { const f = D.fams[g.dataset.f];
    g.classList.toggle('on', !!f && f.pr.some(q => on.has(q)) && (f.ks.some(k => on.has(k)) || f.pr.every(q => on.has(q)))); });
  showPanel(id);
  if (move) { if (wide) fitBox(...bboxOf(on), 30); else { const [x, y, w, h] = bboxOf([id]); fitBox(x - 260, y - 160, w + 520, h + 320, 10); } }
}
function clearSel() {
  if (svg) svg.classList.remove('sel'); panel.classList.remove('open');
}
function chips(ids) { return ids.length ? `<div class="chips">${ids.map(i => `<button data-go="${i}">${esc(pName(i))} <small>${esc(pDates(i))}</small></button>`).join('')}</div>` : '<p class="meta">нет на схеме</p>'; }
function sibHtml(id) {
  const p = D.people[id], par = p.par || [];
  const seen = new Map();
  par.forEach(q => ((D.people[q]||{}).kids || []).forEach(k => { if (k !== id) seen.set(k, (seen.get(k) || new Set()).add(q)); }));
  if (!seen.size) return '<p class="meta">нет на схеме</p>';
  const by = id_ => { const e = D.people[id_].lines.join(' ').match(/(\d{4})/); return e ? +e[1] : 9999; };
  const list = [...seen.entries()].sort((a, b) => by(a[0]) - by(b[0]));
  return `<div class="chips">${list.map(([k, ps]) => { const half = par.length > 1 && ps.size < par.length;
    const via = half ? (D.people[[...ps][0]].sex === 'M' ? ' · по отцу' : ' · по матери') : '';
    return `<button data-go="${k}">${esc(pName(k))} <small>${esc(pDates(k))}${via}</small></button>`; }).join('')}</div>`;
}
function godHtml(p) {
  const a = (p.godp || []).map(g => `<p class="god">Крёстный(ая): ${g.id ? `<button class="chipx" data-go="${g.id}">${esc(pName(g.id))}</button>` : esc(g.name)}${g.y ? ' — ' + esc(g.y) : ''}${g.unsure ? ' (прочтение неуверенное)' : ''}</p>`).join('');
  const b = (p.godc || []).map(g => `<p class="god">Крестил(а): <button class="chipx" data-go="${g.id}">${esc(pName(g.id))}</button>${g.y ? ' — ' + esc(g.y) : ''}${g.unsure ? ' (прочтение неуверенное)' : ''}</p>`).join('');
  return a || b ? `<h3>Крещение</h3>${a}${b}` : '';
}
const lb = document.getElementById('lb');
function openDoc(d) {
  const o = D.docs[d];
  lb.querySelector('.box').innerHTML = `<button class="close" aria-label="Закрыть">×</button><h2>${esc(o.title)}</h2>
    <p class="meta">${esc(o.fond)}; unit ${esc(o.unit)}, кадр ${esc(o.frame)} · <a href="${o.url}" target="_blank" rel="noopener">дело на сайте архива</a></p>
    <img src="${o.img}" alt="${esc(o.title)}"><p><b>Расшифровка.</b> ${esc(o.text)}</p>${o.note ? `<p class="meta">Примечание: ${esc(o.note)}</p>` : ''}
    <h3>Упомянуты на схеме</h3><div class="chips">${o.who.filter(w => D.people[w]).map(w => `<button data-go="${w}">${esc(pName(w))}</button>`).join('')}</div>`;
  lb.classList.add('open'); lb.scrollTop = 0;
}
document.getElementById('help').onclick = () => {
  lb.querySelector('.box').innerHTML = document.getElementById('helpT').innerHTML;
  lb.classList.add('open'); lb.scrollTop = 0;
};
lb.addEventListener('click', e => {
  if (e.target === lb || e.target.closest('.close')) { lb.classList.remove('open'); return; }
  const b = e.target.closest('[data-go]'); if (b) { lb.classList.remove('open'); select(b.dataset.go); }
});
function showPanel(id) {
  const p = D.people[id];
  const ev = p.events.filter(e => e.d || e.n || e.pl).map(e => `<div class="ev"><b>${esc(e.t)}${e.d ? ': ' + esc(e.d) : ''}</b>${e.pl ? '<br>' + esc(e.pl) : ''}${e.n ? '<br>' + linkify(e.n) : ''}${e.s ? `<div class="s">${esc(e.s)}${e.pg ? ' · ' + esc(e.pg) : ''}</div>` : ''}</div>`).join('');
  const mar = p.marr.map(m => `<div class="ev"><b>брак${m.d ? ': ' + esc(m.d) : ''}</b> — с ${esc(pName(m.with))}${m.n ? '<br>' + esc(m.n) : ''}${m.s ? `<div class="s">${esc(m.s)}</div>` : ''}</div>`).join('');
  panel.innerHTML = `<button class="close" aria-label="Закрыть">×</button>
    <h2>${esc(p.lines.filter(t => !/\d{4}|^~|^\?/.test(t) && t !== p.kin && t !== '2-я жена Николая').join(' '))}</h2>
    <p class="meta">${p.kin ? `<span class="kin">${esc(p.kin)}</span>` : ''}${esc(pDates(id))}${p.est && !/\d{4}/.test(pDates(id).replace('~', '')) ? '' : ''} · род: ${esc(p.clan)}${p.role ? ' · ' + esc(p.role) : ''}${p.status === 'doc' ? ' · есть архивный документ' : p.status === 'oral' ? ' · по преданию' : ''}</p>
    ${p.est ? `<p class="meta">Год рождения ~${p.est} — примерная оценка по родным.</p>` : ''}
    ${(p.photos || []).length ? `<div class="photos">${p.photos.map(u => `<img src="${u}" alt="${esc(p.name)}" loading="lazy">`).join('')}</div>` : ''}
    ${godHtml(p)}
    ${(p.docs || []).length ? `<h3>В архивных документах (${p.docs.length})</h3><div class="docs">${p.docs.map(d => { const o = D.docs[d]; return `<button class="doc" data-doc="${d}"><img src="${o.img}" alt="" loading="lazy"><span>${esc(o.title)}<small>кадр ${esc(o.frame)} · нажмите, чтобы открыть скан</small></span></button>`; }).join('')}</div>` : ''}
    ${ev || mar ? `<h3>События</h3>${ev}${mar}` : ''}
    ${p.notes.length ? `<h3>Заметки</h3><div class="notes">${p.notes.map(n => `<p>${linkify(n)}</p>`).join('')}</div>` : ''}
    <h3>Родители</h3>${chips(p.par)}<h3>Братья и сёстры</h3>${sibHtml(id)}<h3>Супруги</h3>${chips(p.sp)}<h3>Дети</h3>${chips(p.kids)}`;
  panel.classList.add('open'); panel.scrollTop = 0;
}
panel.addEventListener('click', e => {
  if (e.target.closest('.close')) return clearSel();
  const dc = e.target.closest('[data-doc]'); if (dc) return openDoc(dc.dataset.doc);
  const b = e.target.closest('[data-go]'); if (b) select(b.dataset.go);
});

/* --- поиск --- */
const q = document.getElementById('q'), res = document.getElementById('results');
q.addEventListener('input', () => {
  const t = norm(q.value.trim()); if (t.length < 2) { res.style.display = 'none'; return; }
  const stem = w => w.length > 4 ? w.replace(/(ых|их|ой|ей|ою|ею|ие|ии|ию|ья|ью|ым|им|ом|ем|ам|ах|ы|и|а|я|у|ю|е)$/, '') : w;
  const words = t.split(/\s+/).map(stem);
  const hits = Object.entries(D.people).filter(([id, p]) => { const n = norm(p.lines.join(' ') + ' ' + (p.alt || []).join(' ')); return words.every(w => n.includes(w)); }).slice(0, 30);
  res.innerHTML = hits.length ? hits.map(([id, p]) => { const via = (p.alt || []).find(a => words.every(w => norm(a).includes(w)) && !words.every(w => norm(p.lines.join(' ')).includes(w)));
    return `<button data-go="${id}">${esc(p.name)} <small>${esc(pDates(id))}${p.kin ? ' · ' + esc(p.kin) : ''}${via ? ' · также: ' + esc(via) : ''}</small></button>`; }).join('') : '<button disabled>Никого не нашлось</button>';
  res.style.display = 'block';
});
res.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) { select(b.dataset.go); res.style.display = 'none'; q.blur(); } });
addEventListener('click', e => { if (!e.target.closest('.search')) res.style.display = 'none'; });

/* --- загрузка --- */
function start() {
  try {
    D = JSON.parse(document.getElementById('treeData').textContent);
    const txt = document.getElementById('treeSvg').textContent.split('<\\/').join('</');
    document.getElementById('loading').remove();
    stage.insertAdjacentHTML('afterbegin', txt);
    svg = stage.querySelector('svg');
    const vb = svg.viewBox.baseVal; W = vb.width; H = vb.height;
    fitAll();
    setTimeout(() => { const h = document.getElementById('hint'); if (h) h.remove(); }, 6000);
  } catch (err) {
    const l = document.getElementById('loading');
    if (l) l.textContent = 'Не удалось показать древо: ' + err;
  }
}
start();
}
</script>
</body>
</html>
