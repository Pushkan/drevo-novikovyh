<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Родословная Новиковых из д. Чикаши</title>
<link rel="stylesheet" href="css/styles.css?v=2.11.0">
</head>
<body>
<header>
  <h1>Родословная Новиковых<small><span id="total"></span>д. Чикаши и породнившиеся семьи · нажмите на человека для фокуса</small></h1>
  
  <div class="search">
    <input id="q" type="search" placeholder="Поиск по имени или фамилии…" autocomplete="off" aria-label="Поиск персоны по имени или фамилии">
    <div id="results" role="listbox" aria-label="Результаты поиска"></div>
  </div>

  <div class="tools">
    <button id="help" type="button" aria-label="Инструкция к схеме">
      <span class="help-text">Инструкция</span>
      <span class="help-icon" aria-hidden="true">?</span>
    </button>
    <button id="allg" type="button" class="main">Раскрыть всё</button>
  </div>

  <nav id="legend" aria-label="Фильтр по родам"></nav>
</header>

<main>
  <div id="stage">
    <div id="loading">Загружаю древо…</div>
    <div id="mm" aria-hidden="true" title="Миникарта древа">
      <svg id="mmS" xmlns="http://www.w3.org/2000/svg">
        <g id="mmC"></g>
        <rect id="mmV" fill="#4a7c5922" stroke="#4a7c59" stroke-width="1.2"/>
      </svg>
    </div>
    <div id="hint">Тяните, чтобы перемещаться · масштаб: колесико, два пальца или двойной тап</div>
  </div>

  <div id="overviewLabels" class="overview-labels" role="group" aria-label="Семьи на общем плане" hidden></div>

  <!-- Мобильные быстрые действия над холстом -->
  <div class="stage-actions" id="stageActions" hidden>
    <button id="clanToggle" type="button" aria-haspopup="dialog">Роды</button>
    <button id="branchToggle" type="button" aria-haspopup="dialog">Ветви</button>
    <details id="zoomMenu">
      <summary aria-label="Управление масштабом">Масштаб</summary>
      <div class="zoom-options" role="group" aria-label="Кнопки зума">
        <button type="button" data-zoom="in" aria-label="Приблизить древо">+</button>
        <button type="button" data-zoom="out" aria-label="Отдалить древо">−</button>
        <button type="button" data-zoom="fit">Вписать</button>
      </div>
    </details>
  </div>

  <!-- Боковая карточка-шторка персоны -->
  <aside id="panel" aria-live="polite" aria-label="Карточка персоны"></aside>
</main>

<footer>
  <span>Разработка — Павел Железняк</span>
  <button id="ver" type="button" title="История изменений проекта">v2.11.0</button>
</footer>

<!-- Мобильный диалог: Ветви древа -->
<dialog class="stage-dialog" id="branchDialog" aria-labelledby="branchTitle">
  <div class="stage-dialog-heading">
    <h2 id="branchTitle">Ветви на схеме</h2>
    <form method="dialog"><button type="submit" aria-label="Закрыть окно ветвей">×</button></form>
  </div>
  <div class="branch-actions" role="group" aria-label="Действия со всеми ветвями">
    <button type="button" id="expandBranches">Раскрыть всё</button>
    <button type="button" id="collapseBranches">Свернуть всё</button>
  </div>
  <div class="stage-list" id="branchList"></div>
</dialog>

<!-- Мобильный диалог: Роды -->
<dialog class="stage-dialog" id="clanDialog" aria-labelledby="clanTitle">
  <div class="stage-dialog-heading">
    <h2 id="clanTitle">Роды на схеме</h2>
    <form method="dialog"><button type="submit" aria-label="Закрыть окно родов">×</button></form>
  </div>
  <div class="stage-list" id="clanList"></div>
</dialog>

<!-- Полноэкранный модальный просмотр (Инструкция / Архивные сканы) -->
<div id="lb" role="dialog" aria-modal="true" aria-label="Просмотр документа"><div class="box"></div></div>

<!-- Шаблон справки/инструкции -->
<template id="helpT">
  <button class="close" type="button" aria-label="Закрыть справку">×</button>
  <h2>Как читать схему</h2>
  
  <h3>Карточки персон</h3>
  <ul>
    <li><b>Светло-голубая</b> карточка — мужчина, <b>сливочно-тёплая</b> — женщина.</li>
    <li><b>Цветная полоска слева</b> — род человека (Новиковы, Белозеровы, Кутрюмовы, Левкины, Бобровы, Бычины, Логиновы, Шестаковы, Железняки). Род ведётся по отцу. Цвета вынесены в легенду под шапкой.</li>
    <li><b>Масштабирование информации</b>: на общем плане показаны компактные подписи семей; на среднем масштабе — имена, фамилии и годы жизни; при приближении открываются полные отчества, девичьи фамилии, точные даты и возраст.</li>
    <li><b>Выразительный контур</b> — персона подтверждена архивными источниками (метрическими книгами, ревизскими сказками).</li>
    <li><b>Пунктирная рамка</b> — персона известна только по семейным воспоминаниям.</li>
    <li>При выборе человека на карточках родственников отображается степень родства относительно него: «отец», «бабушка», «прадед», «сестра», «сын», «невестка»…</li>
  </ul>

  <h3>Даты и условные обозначения</h3>
  <ul>
    <li>«07.03.1877 – 11.05.1949» — точные даты рождения и смерти по метрикам.</li>
    <li>«ок. 1848» — год рассчитан по возрасту в ревизской сказке или документе.</li>
    <li>«~1850» — примерный год, оценённый по окружению и родственникам.</li>
    <li>Даты до 1918 года приведены по старому стилю (по юлианскому календарю метрик).</li>
  </ul>

  <h3>Ветви и навигация</h3>
  <ul>
    <li>Кнопка «Раскрыть всё» разворачивает все скрытые ветви и боковые рода. Кнопка «Свернуть всё» возвращает древо к основному стволу Новиковых.</li>
    <li>Цветные язычки под карточками (например, <i>«＋ Белозеровы и Бобровы · 26»</i>) позволяют разворачивать конкретные интересующие ветви прямо на полотне.</li>
    <li>На смартфонах снизу доступны удобные кнопки: <b>«Ветви»</b>, <b>«Роды»</b> и меню <b>«Масштаб»</b>.</li>
    <li>В шторке персоны кнопка <b>«На весь экран»</b> позволяет комфортно изучить архивные метрические выписи, события и заметки на мобильном устройстве.</li>
  </ul>

  <h3>Управление полотном</h3>
  <ul>
    <li><b>Перемещение</b>: зажмите левую кнопку мыши или проведите пальцем по экрану.</li>
    <li><b>Масштаб</b>: колесико мыши, жест двумя пальцами (pinch-to-zoom) или двойной тап.</li>
    <li><b>Выбор</b>: нажмите на карточку — древо центрируется и перестроится в режим фокуса вокруг выбранного родственника.</li>
  </ul>
</template>

<script src="js/error-handler.js" defer></script>
<script src="js/view-layout.js?v=2.11.0" defer></script>
<script src="js/macro-layout.js?v=2.11.0" defer></script>
<script src="js/app.js?v=2.11.0" defer></script>
</body>
</html>
