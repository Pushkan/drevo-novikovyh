<h2>Как читать схему</h2>
<h3>Карточки</h3>
<ul>
<li><b>Светло-голубая</b> карточка — мужчина, <b>сливочная</b> — женщина.</li>
<li><b>Цветная полоска слева</b> — род человека (Новиковы, Белозеровы, Кутрюмовы, Левкины, Бобровы, Бычины, Логиновы, Шестаковы, Железняки). Род считается по отцу; жена с неизвестными родителями — в роду мужа. Цвета — в легенде под заголовком схемы.</li>
<li>На общем плане видны подписи семей. Нажмите на подпись, чтобы приблизиться. На среднем масштабе видны имена, фамилии и годы жизни. При приближении добавляются отчества, девичьи фамилии и точные даты, если они известны.</li>
<li><b>Толстая рамка</b> — человек найден в архивных документах (метриках, ревизских сказках).</li>
<li><b>Пунктирная рамка карточки</b> — известен только по семейному преданию.</li>
<li>Когда выбран человек, на карточках его родных появляется подпись — кем они ему приходятся: «отец», «бабушка», «пра(3)дед», «сестра», «внучка», «зять»…</li>
</ul>
<h3>Даты</h3>
<ul>
<li>«07.03.1877 – 11.05.1949» — точные даты рождения и смерти; если указана одна дата — это дата рождения, а дата смерти неизвестна или человек жив.</li>
<li>«ок. 1848» — год вычислен по возрасту в документе.</li>
<li>«~1850» — год примерно оценён по родственникам, документов нет.</li>
<li>Даты XIX века — по старому стилю, как в метрических книгах.</li>
</ul>
<p>На телефоне кнопка <b>«Ветви»</b> открывает список с крупными кнопками, а <b>«Масштаб»</b> позволяет приблизить, отдалить или вписать схему. В карточке человека можно нажать <b>«На весь экран»</b> и затем вернуться к схеме.</p>
<h3>Свёрнутые рода</h3>
<ul>
<li>Сначала показаны Новиковы из Чикашей. Семьи, из которых в род пришли жёны и мужья, свёрнуты, и большие ветви внуков Николая и Ефросиньи — тоже.</li>
<li>Цветной язычок под карточкой, например «＋ Белозеровы и Бобровы · 26» или «＋ потомки Раисы · 19», — нажмите, и эта часть раскроется: схема перестроится, а нажатое место останется на экране. Белый язычок «− свернуть» сворачивает обратно.</li>
<li>Кнопка «Раскрыть всё» раскрывает все рода и ветви, «Свернуть всё» возвращает исходный вид. На телефоне обе команды находятся в списке «Ветви».</li>
<li>На компьютере список родов под заголовком, на телефоне — по кнопке «Роды» внизу. Выбор рода покажет его на схеме и приглушит остальные карточки.</li>
</ul>
<h3>Семьи и рамки</h3>
<ul>
<li>Каждое поколение — в своём ряду: старшие сверху, младшие снизу.</li>
<li><b>Серая рамка</b> «дети: Николай и Ефросинья» — братья и сёстры, дети одной пары. Стоят не всегда по возрасту, а так, чтобы быть над своими детьми.</li>
<li><b>Белая пунктирная подложка</b> «жена», «муж», «1-я жена» — супруг из другой семьи (его родители неизвестны), рядом со своим мужем или женой.</li>
<li>«Братья (родители неизвестны)» — Павел и Филипп Бычины.</li>
</ul>
<h3>Линии</h3>
<ul>
<li>Супруги соединены горизонтальной линией, точка на ней — брак. От неё линия идёт вниз к общей горизонтали и к каждому ребёнку.</li>
<li>У каждой семьи свой цвет линий, соседние линии — разных цветов: семью можно проследить по цвету.</li>
<li>Справа вверху — семья Савелия Григорьевича Новикова: соседи из той же деревни, родство не доказано.</li>
</ul>
<h3>Как пользоваться</h3>
<ul>
<li>Двигать — мышкой или пальцем; масштаб — колёсиком, двумя пальцами, или двойным тапом (двойным щелчком).</li>
<li>Нажмите на человека — подсветятся его предки, потомки и супруги, а сбоку откроется карточка: даты, события с источниками, заметки, фото, крёстные, родители, братья и сёстры, супруги, дети.</li>
<li>«В архивных документах» — сканы, где человек упомянут; по нажатию скан открывается крупно, с расшифровкой и ссылкой на дело в Пермском архиве.</li>
<li>Поиск — по имени, фамилии или девичьей фамилии.</li>
<li>Нажмите на человека — схема перестроится вокруг него: сверху его предки, рядом братья, сёстры и супруги, снизу потомки. Закрыть — крестик, Esc или нажатие на пустое место.</li>
</ul>
